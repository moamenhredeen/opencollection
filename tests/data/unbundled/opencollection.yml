info:
  name: Kitchen Sink
  summary: Exercises every construct of the OpenCollection v1.0.0 schema
  version: 2.3.1
  authors:
  - name: Moamen Hraden
    email: moamenhredeen@gmail.com
    url: https://example.com
opencollection: 1.0.0
config:
  environments:
  - name: local
    color: '#00ff00'
    description: Local development
    variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: mode
      value:
      - title: verbose
        selected: true
        value: '1'
      - title: quiet
        value:
          type: number
          data: '0'
    - secret: true
      name: apiKey
      description: API key kept out of the file
      type: string
    dotEnvFilePath: .env.local
  - name: prod
    variables:
    - name: baseUrl
      value: https://api.example.com
      disabled: false
    clientCertificates:
    - type: pkcs12
      domain: api.example.com
      pkcs12FilePath: certs/client.p12
      passphrase: hunter2
    extends: local
  protobuf:
    protoFiles:
    - type: file
      path: protos/pets.proto
    importPaths:
    - path: protos
    - path: vendor/protos
      disabled: true
  proxy:
    disabled: false
    inherit: false
    config:
      protocol: http
      hostname: proxy.local
      port: 8080
      auth:
        disabled: false
        username: proxyuser
        password: proxypass
      bypassProxy: localhost,127.0.0.1
  clientCertificates:
  - type: pem
    domain: example.com
    certificateFilePath: certs/cert.pem
    privateKeyFilePath: certs/key.pem
    passphrase: secret
request:
  headers:
  - name: X-Collection
    value: kitchen-sink
    description: sent with every request
  metadata:
  - name: x-trace
    value: enabled
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://auth.example.com/token
    refreshTokenUrl: https://auth.example.com/refresh
    credentials:
      clientId: my-client
      clientSecret: my-secret
      placement: basic_auth_header
    scope: read write
    additionalParameters:
      accessTokenRequest:
      - name: audience
        value: https://api.example.com
        placement: body
      refreshTokenRequest:
      - name: hint
        value: refresh
        placement: query
    tokenConfig:
      id: main-token
      placement:
        header: Authorization
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
  variables:
  - name: collectionVar
    value: shared
    description:
      content: a collection level variable
      type: text/plain
  scripts:
  - type: before-request
    code: console.log("collection before");
  - type: hooks
    code: console.log("hooks");
  settings:
    http:
      encodeUrl: true
      timeout: 30000
      followRedirects: inherit
      maxRedirects: 5
    graphql:
      timeout: inherit
docs:
  content: |-
    # Kitchen Sink
    Collection-level documentation.
  type: text/markdown
bundled: false
extensions:
  x-vendor:
    generator: opencollection-rs
