info:
  name: oauth2 password
  type: http
http:
  method: GET
  url: https://example.com/ropc
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: https://auth.example.com/token
    credentials:
      clientId: cid
      clientSecret: cs
      placement: body
    resourceOwner:
      username: alice
      password: wonderland
    scope: openid
    tokenConfig:
      placement:
        query: access_token
      source: id_token
