[package]
name = "opencollection"
version = "0.2.0"
edition = "2024"
description = "Typed data model and YAML (de)serializer for the OpenCollection API-collection format (v1.0.0)"
license = "MIT"
readme = "README.md"
keywords = ["opencollection", "bruno", "api", "yaml", "collection"]
categories = ["parser-implementations", "api-bindings"]
repository = "https://github.com/moamenhredeen/opencollection"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[dev-dependencies]
jsonschema = "0.48.0"
serde_json = "1.0.150"
